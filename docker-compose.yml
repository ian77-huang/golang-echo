services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    build: .
    command: ["./migrate"]
    env_file: .env.docker
    volumes:
      - sqlite_data:/app/databases
    depends_on:
      redis:
        condition: service_healthy

  app1: &app
    build: .
    command: ["./server", "app1", ":1323"]
    env_file: .env.docker
    volumes:
      - sqlite_data:/app/databases
      - ./assets:/app/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

  app2:
    <<: *app
    command: ["./server", "app2", ":1323"]

  app3:
    <<: *app
    command: ["./server", "app3", ":1323"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/app/assets:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  sqlite_data:
  redis_data:
