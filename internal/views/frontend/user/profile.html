{{define "title"}}{{t "user.title"}} - {{t "user.profile.title"}}{{end}}

{{define "content_users"}}
<script type="text/javascript">
    document.addEventListener('alpine:init', () => {
        Alpine.data('profileApp', (initialTitle) => {
            return {
                loading: false,
                form: {
                    id: null,
                    name: '',
                    email: '',
                    phone: '',
                    bio: '',
                    avatar_url: '',
                    is_email_notif: true,
                    is_sms_notif: false
                },
                toast: {
                    show: false,
                    message: '',
                    type: 'success'
                },
                showToast(msg, type = 'success') {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.show = true;
                    setTimeout(() => this.toast.show = false, 3000);
                },
                async initData() {
                    try {
                        const res = await fetch('/api/uesr/profile');
                        if (!res.ok) throw new Error('讀取資料失敗');
                        this.form = await res.json();
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    }
                },
                validateField(field) {
                    if (field === 'account') {
                        if (!this.form.account) {
                            this.setErrorMessage('{{t "error.cannot_be_empty" (kv "Name" (t "user.auth.account"))}}');
                        }
                    }

                    if (field === 'password') {
                        if (!this.form.password) {
                            this.setErrorMessage('{{t "error.cannot_be_empty" (kv "Name" (t "user.auth.password"))}}');
                        }
                    }
                },
                validateAll() {
                    this.setErrorMessage("", true);
                    this.validateField('account');
                    this.validateField('password');
                    return this.__errorMessage.length === 0;
                },
                async handleSubmit(event) {
                    if (!this.validateAll()) {
                        return;
                    }
                    this.loading = true;
                    try {
                        const res = await fetch('/api/profile', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.form.name,
                                phone: this.form.phone,
                                bio: this.form.bio,
                                is_email_notif: this.form.is_email_notif,
                                is_sms_notif: this.form.is_sms_notif
                            })
                        });

                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || '儲存失敗');

                        this.showToast('資料已成功更新！', 'success');
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },
            }
        })
    })
</script>
<div class="divider">{{t "user.login"}}</div>
<div x-data="profileApp()" x-init="initData()">
    <form method="post" @submit.prevent="handleSubmit">
        <div class="max-w-4xl mx-auto px-4">
            <!-- 提示訊息 -->
            <div x-show="toast.show" x-transition class="toast toast-top toast-end z-50">
                <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
                    <span x-text="toast.message"></span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                <!-- 左側：大頭貼與基本狀態 -->
                <div class="card bg-base-100 shadow-xl h-fit">
                    <div class="card-body items-center text-center">
                        <!-- 隱藏的 file input -->
                        <input type="file" id="avatarInput" class="hidden" accept="image/*"
                            @change="uploadAvatar($event)" />

                        <!-- 點擊頭像即可觸發上傳 -->
                        <div class="avatar placeholder mb-2 cursor-pointer group relative"
                            @click="document.getElementById('avatarInput').click()">
                            <!-- 有大頭照時顯示 -->
                            <template x-if="form.avatar_url">
                                <img :src="form.avatar_url" alt="Avatar"
                                    class="group-hover:opacity-50 transition object-cover w-full h-full" />
                            </template>

                            <!-- 沒有大頭照時，直接顯示 SVG -->
                            <template x-if="!form.avatar_url">
                                <svg class="w-full h-full text-base-content/30" viewBox="0 0 250 250" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <rect width="250" height="250" fill="currentColor" class="opacity-10" />
                                    <circle cx="125" cy="100" r="35" fill="currentColor" class="opacity-40" />
                                    <path
                                        d="M60 190C60 156.863 86.863 130 120 130H130C163.137 130 190 156.863 190 190V205H60V190Z"
                                        fill="currentColor" class="opacity-40" />
                                </svg>
                            </template>
                            <!-- 懸停時顯示更換文字 -->
                            <div
                                class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition bg-black/40 rounded-full text-white text-xs font-semibold">
                                更換頭像
                            </div>
                        </div>

                        <h2 class="card-title" x-text="form.name || '載入中...'"></h2>
                        <p class="text-sm text-base-content/60" x-text="form.email"></p>
                        <div class="badge badge-primary mt-2">一般會員</div>
                    </div>
                </div>

                <!-- 右側：詳細欄位編輯 -->
                <div class="card bg-base-100 shadow-xl md:col-span-2 gap-6 p-5">
                    <form @submit.prevent="submitForm" class="card-body gap-6">
                        <h2 class="card-title border-b pb-2 text-xl font-bold">個人資料設定</h2>

                        <!-- 基本欄位組 -->
                        <div class="grid gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">姓名</span></label>
                                <input type="text" x-model="form.name" class="input input-bordered w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">電子郵件</span></label>
                                <input type="email" x-model="form.email" class="input input-bordered w-full" disabled />
                                <label class="label">
                                    <span class="label-text-alt text-base-content/50">電子郵件不可修改</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-control w-full">
                            <label class="label"><span class="label-text font-medium">手機號碼</span></label>
                            <input type="tel" x-model="form.phone" class="input input-bordered w-full"
                                placeholder="0912345678" />
                        </div>

                        <div class="form-control w-full gap-2.5 grid">
                            <label class="label"><span class="label-text font-medium">個人簡介</span></label>
                            <textarea x-model="form.bio" class="textarea textarea-bordered h-24 w-full"
                                placeholder="介紹一下你自己吧..."></textarea>
                        </div>

                        <!-- 按鈕區 -->
                        <div class="card-actions justify-end border-t pt-4">
                            <button type="button" @click="initData()" class="btn btn-ghost"
                                :disabled="loading">重設</button>
                            <button type="submit" class="btn btn-primary" :disabled="loading">
                                <span class="loading loading-spinner" x-show="loading"></span>
                                儲存修改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </form>
</div>
{{end}}
