{{define "title"}}{{t "user.title"}} - {{t "user.profile.title"}}{{end}}

{{define "content_users"}}
<script type="text/javascript">
    document.addEventListener('alpine:init', () => {
        Alpine.data('profileApp', (initialTitle) => {
            return {
                loading: false,
                isEmailDisable: true,
                form: {
                    id: null,
                    name: '',
                    email: '',
                    phone: '',
                    bio: '',
                    avatar_url: ''
                },
                toast: {
                    show: false,
                    message: '',
                    type: 'success'
                },
                showToast(msg, type = 'success') {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.show = true;
                    setTimeout(() => this.toast.show = false, 3000);
                },
                async initData() {
                    try {
                        const res = await fetch('/api/user/profile');
                        if (!res.ok) throw new Error('{{t "user.profile.read.failed"}}');
                        rs = await res.json();
                        if (rs.data !== null) {
                            this.form = rs.data;
                        }
                        this.isEmailDisable = (this.form.email !== "")
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    }
                },
                validateAll() {
                    try {
                        if (this.form.name === "") {
                            throw '{{t "error.cannot_be_empty" (kv "Name" (t "user.profile.settings.name"))}}';
                        }
                        if (this.form.email === "") {
                            throw '{{t "error.cannot_be_empty" (kv "Name" (t "user.profile.settings.email"))}}';
                        }
                        if (this.form.phone === "") {
                            throw '{{t "error.cannot_be_empty" (kv "Name" (t "user.profile.settings.phone"))}}';
                        }
                        if (this.form.phone.length !== 10) {
                            throw '{{t "profile.settings.phone.invalid_length"}}';
                        }
                        if (this.form.bio === "") {
                            throw '{{t "error.cannot_be_empty" (kv "Name" (t "user.profile.settings.bio"))}}';
                        }
                    } catch (err) {
                        this.showToast(err, 'error');
                        return false;
                    }
                    return true;
                },
                async handleSubmit(event) {
                    if (!this.validateAll()) {
                        return;
                    }
                    this.loading = true;
                    try {
                        const res = await fetch('/api/user/profile', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.form.name,
                                phone: this.form.phone,
                                email: this.form.email,
                                bio: this.form.bio,
                            })
                        });

                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || '{{t "user.profile.save.failed"}}');

                        this.showToast('{{t "user.profile.update.success"}}', 'success');
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },
                async uploadAvatar(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    maxSize = parseInt("{{.MaxSize}}")
                    if (file.size > maxSize) {
                        this.showToast('{{t "file.upload.size_exceeded" (kv "Size" "1")}}', 'error');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('avatar', file);

                    this.loading = true;
                    try {
                        const res = await fetch('/api/user/profile/avatar', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || '{{t "file.upload.failed"}}');

                        // 更新前端對應的 avatar_url (包含防止快取的隨機參數)
                        this.form.avatar_url = data.avatar_url;
                        this.showToast('{{t "avatar.update.success"}}', 'success');
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    } finally {
                        this.loading = false;
                        // 清空 file input 的值以利重複選取同檔案
                        event.target.value = '';
                    }
                }
            }
        })
    })
</script>
<div class="divider">{{t "user.profile.title"}}</div>
<div x-data="profileApp()" x-init="initData()">
    <form method="post" @submit.prevent="handleSubmit">
        <div class="max-w-4xl mx-auto px-4">
            <div x-show="toast.show" x-transition class="toast toast-top toast-end z-50">
                <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
                    <span x-text="toast.message"></span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="card bg-base-100 shadow-xl h-fit">
                    <div class="card-body items-center text-center">
                        <input type="file" id="avatarInput" class="hidden" accept="image/*"
                            @change="uploadAvatar($event)" />
                        <div class="avatar placeholder mb-2 cursor-pointer group relative"
                            @click="document.getElementById('avatarInput').click()">
                            <template x-if="form.avatar_url">
                                <img :src="form.avatar_url" alt="Avatar"
                                    class="group-hover:opacity-50 transition object-cover w-full h-full" />
                            </template>
                            <template x-if="!form.avatar_url">
                                <svg class="w-full h-full text-base-content/30" viewBox="0 0 250 250" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <rect width="250" height="250" fill="currentColor" class="opacity-10" />
                                    <circle cx="125" cy="100" r="35" fill="currentColor" class="opacity-40" />
                                    <path
                                        d="M60 190C60 156.863 86.863 130 120 130H130C163.137 130 190 156.863 190 190V205H60V190Z"
                                        fill="currentColor" class="opacity-40" />
                                </svg>
                            </template>
                            <div
                                class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition bg-black/40 rounded-full text-white text-xs font-semibold">
                                {{ t "user.profile.changePicture" }}
                            </div>
                        </div>
                        <h2 class="card-title" x-text="form.name"></h2>
                        <p class="text-sm text-base-content/60" x-text="form.email"></p>
                        <div class="badge badge-primary mt-2">{{ t "user.profile.basicMember" }}</div>
                    </div>
                </div>
                <div class="card bg-base-100 shadow-xl md:col-span-2 gap-6 p-5">
                    <form @submit.prevent="submitForm" class="card-body gap-6">
                        <h2 class="card-title border-b pb-2 text-xl font-bold">{{t "user.profile.settings.title"}}</h2>
                        <div class="grid gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">{{t
                                        "user.profile.settings.name"}}</span></label>
                                <input type="text" x-model="form.name" class="input input-bordered w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">{{t
                                        "user.profile.settings.email.title"}}</span></label>
                                <input type="email" x-model="form.email" class="input input-bordered w-full"
                                    :disabled="isEmailDisable" />
                                <template x-if="isEmailDisable">
                                    <label class="label">
                                        <span class="label-text-alt text-base-content/50">{{t
                                            "user.profile.settings.email.readonly"}}</span>
                                    </label>
                                </template>
                            </div>
                        </div>

                        <div class="form-control w-full">
                            <label class="label"><span class="label-text font-medium">{{t
                                    "user.profile.settings.phone.title"}}</span></label>
                            <input type="tel" x-model="form.phone" class="input input-bordered w-full"
                                placeholder="0912345678" />
                        </div>
                        <div class="form-control w-full gap-2.5 grid">
                            <label class="label"><span class="label-text font-medium">{{t
                                    "user.profile.settings.bio.title"}}</span></label>
                            <textarea x-model="form.bio" class="textarea textarea-bordered h-24 w-full" placeholder='{{t 
                                "user.profile.settings.bio.placeholder"}}'></textarea>
                        </div>

                        <div class="card-actions justify-end border-t pt-4">
                            <button type="button" @click="initData()" class="btn btn-ghost" :disabled="loading">{{t
                                "user.profile.settings.button.reset"}}</button>
                            <button type="submit" class="btn btn-primary" :disabled="loading">
                                <span class="loading loading-spinner" x-show="loading"></span>
                                {{t "user.profile.settings.button.save"}}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </form>
</div>
{{end}}
