{{define "content-layout"}}
<script type="text/javascript">
  document.addEventListener('alpine:init', () => {
    Alpine.data('layoutApp', (initialTitle) => ({
      async changeLang(event) {
        const res = await fetch('/api/lang', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            code: event.target.value,
          }),
        })
        location.reload()
      },
    }))
  })
</script>
<div class="navbar bg-base-100 shadow-sm" x-data="layoutApp">
  <div class="flex-none  md:hidden">
    <button class="btn btn-square btn-ghost">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        class="inline-block h-5 w-5 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
  <div class="flex-1">
    <a class="btn btn-ghost text-xl">rbbr</a>
  </div>
  <div class="flex-none">
    <select class="select" @change="changeLang">
      <option {{if eq .Lang "en" }}selected{{end}} value="en">English</option>
      <option {{if eq .Lang "zh-TW" }}selected{{end}} value="zh-TW">繁體中文</option>
    </select>
  </div>
</div>
<main>{{block "content" .}}{{end}}</main>
{{end}}
